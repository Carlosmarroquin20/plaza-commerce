schema {
  query: Query
  mutation: Mutation
}

type Query {
  "The catalogue, one page at a time, ordered by name."
  products(page: Int! = 1, pageSize: Int! = 20): ProductPage!
    @listSize(
      assumedSize: 20
      slicingArguments: ["pageSize"]
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  product(id: UUID!): Product @cost(weight: "10")
  "Searches the catalogue by keywords and similarity, best matches first."
  searchProducts(query: String!, first: Int! = 5, maxPriceCents: Long): [Product!]!
    @listSize(
      assumedSize: 5
      slicingArguments: ["first"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "One of the caller's orders. An order that belongs to someone else does not exist for the caller."
  order(id: UUID!): Order @cost(weight: "10")
  "The caller's most recent orders, newest first."
  myOrders(first: Int! = 10): [Order!]!
    @listSize(
      assumedSize: 10
      slicingArguments: ["first"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
}

type Mutation {
  """
  Places an order for the caller. The answer is immediate and the order starts as Pending:
  stock and payment are decided afterwards, so read the order again to follow it.
  """
  placeOrder(input: PlaceOrderInput!): PlaceOrderPayload! @cost(weight: "10")
  """
  Sends a message to the shopping assistant. Reusing a conversation id continues that
  conversation; a conversation belongs to the caller who started it.
  """
  askAssistant(conversationId: UUID!, text: String!): AskAssistantPayload!
    @cost(weight: "50")
}

type AskAssistantPayload {
  reply: String
  cart: Cart
  blocked: Boolean!
  error: String
}

"A proposal built by the assistant; nothing is reserved or charged."
type Cart {
  lines: [CartLine!]!
  totalCents: Long!
  currency: String!
  problems: [String!]!
}

type CartLine {
  productId: UUID!
  name: String!
  unitPriceCents: Long!
  quantity: Int!
  lineTotalCents: Long!
}

"An order and where its checkout stands."
type Order {
  id: UUID!
  status: String!
  totalCents: Long!
  currency: String!
  failureReason: String
  items: [OrderItem!]!
    @listSize(assumedSize: 10, requireOneSlicingArgument: false)
  createdAt: DateTime!
  updatedAt: DateTime!
  expiresAt: DateTime!
}

"A line of an order, with the name and price the product had when it was bought."
type OrderItem {
  productId: UUID!
  productName: String!
  unitPriceCents: Long!
  quantity: Int!
  "The product as it is in the catalogue today; null if it no longer exists."
  product: Product
}

"The accepted order, or the reasons it was refused. An accepted order is still being checked out."
type PlaceOrderPayload {
  order: Order
  errors: [String!]!
}

"A product of the catalogue."
type Product {
  id: UUID!
  sku: String!
  name: String!
  description: String!
  category: String!
  priceCents: Long!
  currency: String!
  "Units that can be bought right now."
  availableStock: Int! @cost(weight: "1")
  """
  Products similar to this one. Each product on which this field is selected costs one
  search, which is why the field is expensive and the depth of a query is limited.
  """
  similar(first: Int! = 3): [Product!]!
    @cost(weight: "25")
    @listSize(
      assumedSize: 3
      slicingArguments: ["first"]
      requireOneSlicingArgument: false
    )
}

"One page of the catalogue."
type ProductPage {
  items: [Product!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

input OrderLineInput {
  productId: UUID!
  quantity: Int!
}

input PlaceOrderInput {
  "Opaque token from the payment provider (tok_...). Never card data."
  paymentToken: String!
  lines: [OrderLineInput!]!
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION

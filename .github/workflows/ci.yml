name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Plaza.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Plaza.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Plaza.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test --solution Plaza.slnx --configuration Release --no-build
          --report-xunit-trx --results-directory test-results --results-directory-layout per-module

      # The eval reports say which labelled cases failed and how each metric compares with its baseline.
      - name: Publish eval reports
        if: always()
        run: |
          for report in tests/Plaza.Evals/bin/Release/net10.0/eval-*.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY" && mkdir -p test-results/evals && cp "$report" test-results/evals/
          done
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
